<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work Info</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        :root {
            --primary: #0078d4;
            --primary-dark: #005a9e;
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --hover: #f0f7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        header p {
            margin-top: 8px;
            opacity: 0.9;
        }

        .container {
            max-width: 1600px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.9fr);
            align-items: start;
            gap: 24px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        #filter-count {
            white-space: nowrap;
            font-size: 0.9rem;
            color: #666;
        }

        info {
            white-space: pre-wrap;
            margin: -15px;
            padding: 15px;
            border-radius: 8px;
        }

        info[contenteditable="true"]:focus {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
        }

        #search {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fafafa;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        th,
        td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: var(--hover);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
        }

        a:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            background: #eef6ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
        }

        .count {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .todo-card {
            margin-top: 0;
            padding: 24px;
        }

        .todo-card h2 {
            margin: 0 0 16px;
            font-size: 1.25rem;
            margin-top: 40px;
        }

        .todo-form {
            display: flex;
            gap: 10px;
        }

        .todo-form input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
        }

        .todo-form input:focus,
        .todo-form button:focus-visible,
        .todo-delete:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .todo-form button {
            padding: 0 18px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .todo-form button:hover {
            background: var(--primary-dark);
        }

        .todo-list {
            display: grid;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }

        .todo-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .todo-text {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .todo-item.completed .todo-text {
            color: #6b7280;
            text-decoration: line-through;
        }

        .todo-delete {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #6b7280;
            font-size: 20px;
            cursor: pointer;
        }

        .todo-delete:hover {
            background: #fff1f0;
            color: #b42318;
        }

        .todo-empty {
            padding: 14px 10px;
            color: #6b7280;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 480px) {
            .todo-card {
                padding: 18px;
            }

            .todo-form button {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌐 My Work Info</h1>
        <p>All you need is...</p>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            <div class="card">

                <div class="toolbar">
                    <input type="text" id="search" placeholder="🔍 Nach Titel oder URL suchen ...">
                    <span id="filter-count" aria-live="polite"></span>
                </div>

                <table id="tabTable">
                    <thead>
                        <tr>
                            <th onclick="sortTable(0)">Titel ▲▼</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <section class="card todo-card" aria-labelledby="todo-heading">
                <info id="info-editor" contenteditable="true" role="textbox" aria-label="Editierbare Informationen"
                    aria-multiline="true">
                </info>
                <h2 id="todo-heading">To-do Liste</h2>
                <form class="todo-form" id="todo-form">
                    <label class="sr-only" for="todo-input">Neue Aufgabe</label>
                    <input id="todo-input" type="text" maxlength="200" placeholder="Neue Aufgabe ..." required>
                    <button type="submit">Hinzufügen</button>
                </form>
                <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
                <p class="count" id="todo-count" aria-live="polite"></p>
            </section>
        </div>
    </div>

    <script>
        const searchInput = document.getElementById('search');

        function applyFilter() {
            const filter = searchInput.value.toLowerCase();
            const rows = document.querySelectorAll('#tabTable tbody tr');
            let visible = 0;

            rows.forEach(row => {
                const match = row.textContent.toLowerCase().includes(filter);
                row.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            document.getElementById('filter-count').textContent = visible + ' / ' + rows.length;
        }

        searchInput.addEventListener('input', applyFilter);

        async function loadLinks() {
            const tbody = document.querySelector('#tabTable tbody');
            try {
                // Absolute path, so it also works when the page is served as /dashboard
                const response = await fetch('/admin/links.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error(response.status);
                const links = await response.json();
                links.forEach(link => {
                    if (!link || typeof link.url !== 'string' || !/^https?:\/\//i.test(link.url)) return;
                    const row = tbody.insertRow();
                    const anchor = document.createElement('a');
                    anchor.href = link.url;
                    anchor.target = '_blank';
                    anchor.rel = 'noopener';
                    anchor.textContent = link.title || link.url;
                    row.insertCell().appendChild(anchor);
                    row.insertCell();
                });
            } catch (error) {
                const cell = tbody.insertRow().insertCell();
                cell.colSpan = 2;
                cell.textContent = 'Links konnten nicht geladen werden.';
            }
            applyFilter();
            sortTable(0);
        }

        function sortTable(col) {
            const table = document.getElementById("tabTable");
            const tbody = table.tBodies[0];
            const rows = Array.from(tbody.rows);

            const asc = table.dataset.sortDir !== "asc";

            rows.sort((a, b) =>
                asc
                    ? a.cells[col].innerText.localeCompare(b.cells[col].innerText, 'de')
                    : b.cells[col].innerText.localeCompare(a.cells[col].innerText, 'de')
            );

            rows.forEach(row => tbody.appendChild(row));

            table.dataset.sortDir = asc ? "asc" : "desc";
        }

        const todoStorageKey = 'gothaer-work-info-todos';
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const todoCount = document.getElementById('todo-count');
        const infoEditor = document.getElementById('info-editor');
        const infoStorageKey = 'gothaer-work-info-details';
        let todos = [];

        try {
            const savedInfo = localStorage.getItem(infoStorageKey);
            if (savedInfo !== null) {
                infoEditor.textContent = savedInfo;
            }
        } catch (error) {
            // Editing remains available even when browser storage is disabled.
        }

        infoEditor.addEventListener('input', () => {
            try {
                localStorage.setItem(infoStorageKey, infoEditor.innerText);
            } catch (error) {
                // Keep the current edit available for this page session.
            }
        });

        try {
            const savedTodos = JSON.parse(localStorage.getItem(todoStorageKey) || '[]');
            if (Array.isArray(savedTodos)) {
                todos = savedTodos.filter(todo =>
                    todo && typeof todo.id === 'string' &&
                    typeof todo.text === 'string' && typeof todo.completed === 'boolean'
                );
            }
        } catch (error) {
            todos = [];
        }

        function saveTodos() {
            try {
                localStorage.setItem(todoStorageKey, JSON.stringify(todos));
            } catch (error) {
                todoCount.textContent = 'Speichern im Browser ist derzeit nicht möglich.';
            }
        }

        function renderTodos() {
            todoList.replaceChildren();

            todos.forEach(todo => {
                const item = document.createElement('li');
                item.className = `todo-item${todo.completed ? ' completed' : ''}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.setAttribute('aria-label', `Aufgabe erledigt: ${todo.text}`);
                checkbox.addEventListener('change', () => {
                    todo.completed = checkbox.checked;
                    saveTodos();
                    renderTodos();
                });

                const text = document.createElement('span');
                text.className = 'todo-text';
                text.textContent = todo.text;

                const deleteButton = document.createElement('button');
                deleteButton.className = 'todo-delete';
                deleteButton.type = 'button';
                deleteButton.textContent = '×';
                deleteButton.setAttribute('aria-label', `Aufgabe löschen: ${todo.text}`);
                deleteButton.title = 'Aufgabe löschen';
                deleteButton.addEventListener('click', () => {
                    todos = todos.filter(entry => entry.id !== todo.id);
                    saveTodos();
                    renderTodos();
                });

                item.append(checkbox, text, deleteButton);
                todoList.appendChild(item);
            });

            if (todos.length === 0) {
                const emptyMessage = document.createElement('li');
                emptyMessage.className = 'todo-empty';
                emptyMessage.textContent = 'Noch keine Aufgaben.';
                todoList.appendChild(emptyMessage);
            }

            const openCount = todos.filter(todo => !todo.completed).length;
            todoCount.textContent = `${openCount} offen · ${todos.length} insgesamt`;
        }

        todoForm.addEventListener('submit', event => {
            event.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            todos.push({
                id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
                text,
                completed: false
            });
            saveTodos();
            renderTodos();
            todoForm.reset();
            todoInput.focus();
        });

        renderTodos();

        loadLinks();
    </script>

</body>

</html>
