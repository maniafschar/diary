<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Work Info</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <style>
        :root {
            --primary: #0078d4;
            --primary-dark: #005a9e;
            --bg: #f5f7fb;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #1f2937;
            --hover: #f0f7ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: white;
            padding: 30px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2rem;
        }

        header span {
            margin-top: 8px;
            opacity: 0.9;
            display: inline-block;
        }

        .container {
            max-width: 1600px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: minmax(0, 1.6fr) minmax(320px, 0.9fr);
            align-items: start;
            gap: 24px;
        }

        .card {
            background: var(--card);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, .08);
            overflow: hidden;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 20px;
            border-bottom: 1px solid var(--border);
        }

        #filter-count {
            white-space: nowrap;
            font-size: 0.9rem;
            color: #666;
        }

        info {
            white-space: pre-wrap;
            margin: -15px;
            padding: 15px;
            border-radius: 8px;
            display: block;
        }

        info[contenteditable="true"]:focus {
            outline: 2px solid var(--primary);
            outline-offset: -2px;
        }

        #search {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #fafafa;
            cursor: pointer;
            user-select: none;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        th,
        td {
            text-align: left;
            padding: 14px 16px;
            border-bottom: 1px solid var(--border);
        }

        tr:hover {
            background: var(--hover);
        }

        a {
            color: var(--primary);
            text-decoration: none;
            word-break: break-all;
        }

        a:hover {
            text-decoration: underline;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            background: #eef6ff;
            color: var(--primary);
            font-size: 12px;
            font-weight: 600;
        }

        .count {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        .todo-card {
            margin-top: 0;
            padding: 24px;
        }

        .todo-card h2 {
            margin: 0 0 16px;
            font-size: 1.25rem;
            margin-top: 40px;
        }

        .todo-form {
            display: flex;
            gap: 10px;
        }

        .todo-form input {
            flex: 1;
            min-width: 0;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font: inherit;
        }

        .todo-form input:focus,
        .todo-form button:focus-visible,
        .todo-delete:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }

        .todo-form button {
            padding: 0 18px;
            border: 0;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .todo-form button:hover {
            background: var(--primary-dark);
        }

        .todo-list {
            display: grid;
            gap: 8px;
            margin: 18px 0 0;
            padding: 0;
            list-style: none;
        }

        .todo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            min-height: 48px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--border);
        }

        .todo-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .todo-note {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .todo-item.completed .todo-note {
            color: #6b7280;
            text-decoration: line-through;
        }

        .todo-delete {
            width: 36px;
            height: 36px;
            border: 0;
            border-radius: 6px;
            background: transparent;
            color: #6b7280;
            font-size: 20px;
            cursor: pointer;
        }

        .todo-delete:hover {
            background: #fff1f0;
            color: #b42318;
        }

        .link-note {
            color: #6b7280;
        }

        .todo-empty {
            padding: 14px 10px;
            color: #6b7280;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @media (max-width: 900px) {
            .dashboard-grid {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 480px) {
            .todo-card {
                padding: 18px;
            }

            .todo-form button {
                padding: 0 12px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>🌐 My Work Info</h1>
        <span>All you need is...</span>
    </header>

    <div class="container">
        <div class="dashboard-grid">
            <section class="card todo-card" aria-labelledby="links-heading">
                <h2 id="links-heading" style="margin-top:0">Links</h2>
                <form class="todo-form" id="link-form">
                    <label class="sr-only" for="link-title">Titel</label>
                    <input id="link-title" type="text" maxlength="200" placeholder="Titel ..." required>
                    <label class="sr-only" for="link-url">URL</label>
                    <input id="link-url" type="url" placeholder="https://..." required>
                    <label class="sr-only" for="link-note">Bemerkung</label>
                    <input id="link-note" type="text" maxlength="500" placeholder="Bemerkung ...">
                    <button type="submit">Hinzufügen</button>
                </form>
                <form class="todo-form" id="search-form" style="margin-top:10px" onsubmit="return false">
                    <label class="sr-only" for="search">Suchen</label>
                    <input type="text" id="search" placeholder="🔍 Nach Titel oder URL suchen ...">
                </form>
                <ul class="todo-list" id="link-list" aria-live="polite"></ul>
                <p class="count" id="filter-count" aria-live="polite"></p>
            </section>

            <section class="card todo-card" aria-labelledby="todo-heading">
                <info id="info-editor" contenteditable="true" role="textbox" aria-label="Editierbare Informationen"
                    aria-multiline="true">
                </info>
                <h2 id="todo-heading">To-do Liste</h2>
                <form class="todo-form" id="todo-form">
                    <label class="sr-only" for="todo-input">Neue Aufgabe</label>
                    <input id="todo-input" type="text" maxlength="200" placeholder="Neue Aufgabe ..." required>
                    <button type="submit">Hinzufügen</button>
                </form>
                <ul class="todo-list" id="todo-list" aria-live="polite"></ul>
                <p class="count" id="todo-count" aria-live="polite"></p>
            </section>
        </div>
    </div>

    <script>
        const apiUrl = '/rest/sc/dashboard';
        const searchInput = document.getElementById('search');
        const linkList = document.getElementById('link-list');
        const todoForm = document.getElementById('todo-form');
        const todoInput = document.getElementById('todo-input');
        const todoList = document.getElementById('todo-list');
        const todoCount = document.getElementById('todo-count');
        const infoEditor = document.getElementById('info-editor');
        let links = [];
        let todos = [];

        // The admin login of the support center (index.html) stores the same secret
        async function api(method, path = '', body, extraHeaders = {}) {
            let secret = localStorage.getItem('credentials');
            if (!secret) {
                secret = prompt('Admin-Zugang:');
                if (!secret) throw new Error('Kein Zugang angegeben');
                localStorage.setItem('credentials', secret);
            }
            const response = await fetch(apiUrl + path, {
                method,
                headers: { 'contactId': secret, 'Content-Type': 'application/json', ...extraHeaders },
                body: body === undefined ? undefined : JSON.stringify(body)
            });
            if (response.status === 401) {
                localStorage.removeItem('credentials');
                throw new Error('Zugang abgelehnt');
            }
            if (!response.ok) throw new Error('Fehler ' + response.status);
            const note = await response.text();
            return note ? JSON.parse(note) : null;
        }

        function fail(error) {
            alert('Aktion fehlgeschlagen: ' + error.message);
        }

        const validLink = link => link && typeof link.url === 'string' &&
            /^https?:\/\//i.test(link.url) && typeof link.title === 'string';

        function applyFilter() {
            const filter = searchInput.value.toLowerCase();
            const items = linkList.querySelectorAll('.todo-item');
            let visible = 0;

            items.forEach(item => {
                const match = item.textContent.toLowerCase().includes(filter) ||
                    item.querySelector('a').href.toLowerCase().includes(filter);
                item.style.display = match ? '' : 'none';
                if (match) visible++;
            });
            document.getElementById('filter-count').textContent = visible + ' / ' + items.length;
        }

        searchInput.addEventListener('input', applyFilter);

        function renderLinks() {
            linkList.replaceChildren();
            links.slice().sort((a, b) => a.title.localeCompare(b.title, 'de')).forEach(link => {
                const item = document.createElement('li');
                item.className = 'todo-item';

                const text = document.createElement('span');
                text.className = 'todo-note';
                const anchor = document.createElement('a');
                anchor.href = link.url;
                anchor.target = '_blank';
                anchor.rel = 'noopener';
                anchor.textContent = link.title || link.url;
                text.appendChild(anchor);

                const deleteButton = document.createElement('button');
                deleteButton.className = 'todo-delete';
                deleteButton.type = 'button';
                deleteButton.textContent = '×';
                deleteButton.title = 'Link löschen';
                deleteButton.setAttribute('aria-label', `Link löschen: ${link.title}`);
                deleteButton.addEventListener('click', async () => {
                    if (!confirm(`Link "${link.title}" wirklich löschen?`)) return;
                    try {
                        await api('DELETE', '/link/' + link.id);
                        links = links.filter(entry => entry !== link);
                        renderLinks();
                    } catch (error) {
                        fail(error);
                    }
                });

                const note = document.createElement('span');
                note.className = 'todo-note link-note';
                note.textContent = link.note || '';

                item.append(text, note, deleteButton);
                linkList.appendChild(item);
            });

            if (links.length === 0) {
                const empty = document.createElement('li');
                empty.className = 'todo-empty';
                empty.textContent = 'Noch keine Links.';
                linkList.appendChild(empty);
            }
            applyFilter();
        }

        document.getElementById('link-form').addEventListener('submit', async event => {
            event.preventDefault();
            const form = event.target;
            const title = document.getElementById('link-title').value.trim();
            const url = document.getElementById('link-url').value.trim();
            const note = document.getElementById('link-note').value.trim();
            if (!title || !validLink({ title, url })) {
                alert('Bitte einen Titel und eine gültige http(s)-URL angeben.');
                return;
            }
            try {
                links.push(await api('POST', '/link', { title, url, note }));
                renderLinks();
                form.reset();
            } catch (error) {
                fail(error);
            }
        });

        function renderTodos() {
            todoList.replaceChildren();

            todos.forEach(todo => {
                const item = document.createElement('li');
                item.className = `todo-item${todo.completed ? ' completed' : ''}`;

                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.checked = todo.completed;
                checkbox.setAttribute('aria-label', `Aufgabe erledigt: ${todo.note}`);
                checkbox.addEventListener('change', async () => {
                    try {
                        await api('PUT', '/todo/' + todo.id, { completed: checkbox.checked });
                        todo.completed = checkbox.checked;
                    } catch (error) {
                        fail(error);
                    }
                    renderTodos();
                });

                const note = document.createElement('span');
                note.className = 'todo-note';
                note.textContent = todo.note;

                const deleteButton = document.createElement('button');
                deleteButton.className = 'todo-delete';
                deleteButton.type = 'button';
                deleteButton.textContent = '×';
                deleteButton.setAttribute('aria-label', `Aufgabe löschen: ${todo.note}`);
                deleteButton.title = 'Aufgabe löschen';
                deleteButton.addEventListener('click', async () => {
                    try {
                        await api('DELETE', '/todo/' + todo.id);
                        todos = todos.filter(entry => entry !== todo);
                        renderTodos();
                    } catch (error) {
                        fail(error);
                    }
                });

                item.append(checkbox, note, deleteButton);
                todoList.appendChild(item);
            });

            if (todos.length === 0) {
                const emptyMessage = document.createElement('li');
                emptyMessage.className = 'todo-empty';
                emptyMessage.textContent = 'Noch keine Aufgaben.';
                todoList.appendChild(emptyMessage);
            }

            const openCount = todos.filter(todo => !todo.completed).length;
            todoCount.textContent = `${openCount} offen · ${todos.length} insgesamt`;
        }

        todoForm.addEventListener('submit', async event => {
            event.preventDefault();
            const note = todoInput.value.trim();
            if (!note) return;
            try {
                todos.push(await api('POST', '/todo', { note }));
                renderTodos();
                todoForm.reset();
                todoInput.focus();
            } catch (error) {
                fail(error);
            }
        });

        let infoTimer = null;
        let infoDirty = false;

        async function saveInfo() {
            clearTimeout(infoTimer);
            if (!infoDirty) return;
            infoDirty = false;
            try {
                await api('PUT', '/info', { note: infoEditor.innerText });
            } catch (error) {
                infoDirty = true;
                console.error(error);
            }
        }

        infoEditor.addEventListener('input', () => {
            infoDirty = true;
            clearTimeout(infoTimer);
            infoTimer = setTimeout(saveInfo, 800);
        });
        infoEditor.addEventListener('blur', saveInfo);
        window.addEventListener('pagehide', saveInfo);

        const toBase64 = bytes => btoa(String.fromCharCode(...new Uint8Array(bytes)));
        const fromBase64 = text => Uint8Array.from(atob(text), c => c.charCodeAt(0));

        // The private key never leaves the browser; the server only gets the public key
        async function loadEncrypted() {
            const keyPair = await crypto.subtle.generateKey({
                name: 'RSA-OAEP', modulusLength: 2048, publicExponent: new Uint8Array([1, 0, 1]), hash: 'SHA-256'
            }, false, ['decrypt']);
            const publicKey = toBase64(await crypto.subtle.exportKey('spki', keyPair.publicKey));
            const encrypted = await api('GET', '', undefined, { publicKey });
            const aesKey = await crypto.subtle.importKey('raw',
                await crypto.subtle.decrypt({ name: 'RSA-OAEP' }, keyPair.privateKey, fromBase64(encrypted.key)),
                'AES-GCM', false, ['decrypt']);
            const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromBase64(encrypted.iv) },
                aesKey, fromBase64(encrypted.data));
            return JSON.parse(new TextDecoder().decode(plain));
        }

        async function load() {
            try {
                const data = await loadEncrypted();
                links = data.links;
                todos = data.todos;
                infoEditor.textContent = data.info;
            } catch (error) {
                fail(error);
            }
            renderLinks();
            renderTodos();
        }

        load();
    </script>

</body>

</html>
